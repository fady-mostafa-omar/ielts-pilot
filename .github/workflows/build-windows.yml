name: Build Windows installer

# Windows minutes are limited on private repos: build only on a version tag or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Backend — install and test
        working-directory: backend
        run: |
          python -m pip install -r requirements-build.txt
          python -m pytest -q

      - name: Backend — build (PyInstaller onedir)
        working-directory: backend
        run: python -m PyInstaller ielts_pilot_backend.spec --noconfirm --clean

      - name: Backend — smoke test the binary
        run: ./scripts/ci/backend-smoke.ps1

      - name: Frontend — build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desktop — package NSIS installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      - name: Installer — install, run twice, uninstall
        run: ./scripts/ci/installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: IELTS-Pilot-installer
          path: desktop/release/IELTS-Pilot-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            ${{ runner.temp }}/ip-ci/**
          if-no-files-found: ignore
          retention-days: 14
