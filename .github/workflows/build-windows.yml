name: Build Windows installer

# Windows minutes are limited on private repos: build only on a version tag or by hand.
# A version tag (vX.Y.Z) also publishes the installer to the public releases repository
# (fady-mostafa-omar/ielts-pilot-releases) that the app's Update tab reads (D-027).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Backend — install and test
        working-directory: backend
        run: |
          python -m pip install -r requirements-build.txt
          python -m pytest -q

      - name: Backend — build (PyInstaller onedir)
        working-directory: backend
        run: python -m PyInstaller ielts_pilot_backend.spec --noconfirm --clean

      - name: Backend — smoke test the binary
        run: ./scripts/ci/backend-smoke.ps1

      - name: Frontend — build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desktop — package NSIS installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      - name: Installer — install, run twice, uninstall
        run: ./scripts/ci/installer-smoke.ps1

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./desktop/package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $PKG"
            exit 1
          fi
          cd desktop/release
          ls -la
          test -f latest.yml
          gh release create "v$VERSION" \
            "IELTS-Pilot-Setup-$VERSION.exe" \
            "IELTS-Pilot-Setup-$VERSION.exe.blockmap" \
            latest.yml \
            --repo fady-mostafa-omar/ielts-pilot-releases \
            --title "IELTS Pilot $VERSION" \
            --notes-file ../build/release-notes.md

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: IELTS-Pilot-installer
          path: desktop/release/IELTS-Pilot-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            ${{ runner.temp }}/ip-ci/**
          if-no-files-found: ignore
          retention-days: 14
