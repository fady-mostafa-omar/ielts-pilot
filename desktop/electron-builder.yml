appId: app.ieltspilot.desktop
productName: IELTS Pilot
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - ui/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../backend/dist/ielts_pilot_backend
    to: backend
    filter: ["**/*"]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: IELTS-Pilot-Setup-${version}.${ext}
# Installers and latest.yml go to the public releases repository (D-027); the release
# workflow uploads them, so local and CI builds use --publish never.
publish:
  provider: github
  owner: fady-mostafa-omar
  repo: ielts-pilot-releases
  releaseType: release
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
linux:
  target: dir
